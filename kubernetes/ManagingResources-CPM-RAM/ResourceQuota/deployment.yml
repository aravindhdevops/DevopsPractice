kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      obj: deployment
  template:
    metadata:
      labels:
        obj: deployment
    spec:
      containers:
        - name: c1
          image: ubuntu
          command: ["/bin/bash","-c","while true; do echo 'hi'; sleep 5; done"]
          resources:
            requests:
              cpu: 200m